<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" width="960" height="1180" style="background: transparent; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.3" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F0FF" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Canvas Outer Container -->
  <rect x="15" y="15" width="930" height="1150" rx="20" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5" filter="url(#cardGlow)" />

  <!-- Title Badge -->
  <g transform="translate(480, 50)">
    <text text-anchor="middle" fill="#F1F5F9" font-size="20" font-weight="800" letter-spacing="-0.02em">FORGEDATASET PIPELINE ARCHITECTURE</text>
    <text text-anchor="middle" y="24" fill="#94A3B8" font-size="12" font-weight="500">Local Document-to-SFT Dataset Factory | Multi-Engine Verification Flow</text>
  </g>

  <!-- Document input -->
  <g transform="translate(300, 105)">
    <rect width="360" height="60" rx="10" fill="#141B2D" stroke="#00F0FF" stroke-width="1.5" filter="url(#cyanGlow)" />
    <text x="180" y="28" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="0.08em">DOCUMENT INPUT</text>
    <text x="180" y="48" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="600">Raw Files: PDF &#8226; DOCX &#8226; XLSX &#8226; PPTX &#8226; MD &#8226; CSV</text>
  </g>

  <!-- Connect Stage 1 to Router -->
  <line x1="480" y1="165" x2="480" y2="195" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 1: INGESTION & PARSING ROUTER -->
  <g transform="translate(80, 195)">
    <rect width="800" height="155" rx="12" fill="#101726" stroke="#1E293B" stroke-width="1.2" />
    <text x="400" y="26" text-anchor="middle" fill="#818CF8" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 1 &#8226; INGESTION &amp; PARSING ROUTER</text>
    
    <!-- Parser 1: Docling -->
    <g transform="translate(30, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Docling Parser</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">PDF &amp; DOCX Documents</text>
      <text x="110" y="68" text-anchor="middle" fill="#00F0FF" font-size="10" font-family="'JetBrains Mono', monospace">Reading Order &amp; Layout</text>
    </g>

    <!-- Parser 2: OpenPyXL -->
    <g transform="translate(290, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">OpenPyXL Engine</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Excel &amp; CSV Spreadsheets</text>
      <text x="110" y="68" text-anchor="middle" fill="#10B981" font-size="10" font-family="'JetBrains Mono', monospace">Matrix, Cells &amp; Formulas</text>
    </g>

    <!-- Parser 3: Native / OCR -->
    <g transform="translate(550, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Native &amp; OCR Engine</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Markdown, Code &amp; Scans</text>
      <text x="110" y="68" text-anchor="middle" fill="#F59E0B" font-size="10" font-family="'JetBrains Mono', monospace">Fast Fallback Extraction</text>
    </g>
  </g>

  <!-- Connect Stage 2 to Canonical Document -->
  <line x1="480" y1="350" x2="480" y2="380" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 2: CANONICAL DOCUMENT SCHEMA -->
  <g transform="translate(260, 380)">
    <rect width="440" height="65" rx="10" fill="#141B2D" stroke="#818CF8" stroke-width="1.2" />
    <text x="220" y="26" text-anchor="middle" fill="#818CF8" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 2 &#8226; CANONICAL DOCUMENT</text>
    <text x="220" y="46" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="500">Uniform Structural Elements &#8226; Headings &#8226; Tables &#8226; Bounding Coordinates</text>
  </g>

  <!-- Connect Stage 3 to Hybrid Chunker -->
  <line x1="480" y1="445" x2="480" y2="475" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 3: ZERO-OVERLAP HYBRID CHUNKER -->
  <g transform="translate(180, 475)">
    <rect width="600" height="85" rx="12" fill="#101726" stroke="#00F0FF" stroke-width="1.5" />
    <text x="300" y="26" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 3 &#8226; HYBRID CHUNKING ENGINE</text>
    <text x="300" y="48" text-anchor="middle" fill="#F1F5F9" font-size="14" font-weight="700">Zero Token Overlap &#8226; Heading Path Hierarchies &#8226; Table Duplication</text>
    <text x="300" y="68" text-anchor="middle" fill="#94A3B8" font-size="11">Budget: 600 Tokens &#8226; Min Merge: 150 Tokens &#8226; No Sliding Window Token Bleed</text>
  </g>

  <!-- Connect Stage 4 to Multi-Engine SFT Generation -->
  <line x1="480" y1="560" x2="480" y2="590" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 4: MULTI-ENGINE INFERENCE LAYER -->
  <g transform="translate(80, 590)">
    <rect width="800" height="155" rx="12" fill="#101726" stroke="#1E293B" stroke-width="1.2" />
    <text x="400" y="26" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 4 &#8226; MULTI-ENGINE SFT GENERATION</text>
    
    <!-- Engine 1: llama.cpp -->
    <g transform="translate(30, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">llama.cpp Engine</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">In-Process GGUF</text>
      <text x="110" y="68" text-anchor="middle" fill="#10B981" font-size="10" font-family="'JetBrains Mono', monospace">Zero Server Needed</text>
    </g>

    <!-- Engine 2: Ollama -->
    <g transform="translate(290, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Ollama Engine</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Local REST Daemon</text>
      <text x="110" y="68" text-anchor="middle" fill="#00F0FF" font-size="10" font-family="'JetBrains Mono', monospace">Auto VRAM Purging</text>
    </g>

    <!-- Engine 3: OpenAI Compatible / vLLM -->
    <g transform="translate(550, 42)">
      <rect width="220" height="90" rx="8" fill="#172033" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">OpenAI / vLLM</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">/v1 Batch Endpoint</text>
      <text x="110" y="68" text-anchor="middle" fill="#F59E0B" font-size="10" font-family="'JetBrains Mono', monospace">High Concurrency</text>
    </g>
  </g>

  <!-- Connect Stage 5 to Quality Gate -->
  <line x1="480" y1="745" x2="480" y2="775" stroke="#00F0FF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 5: QUALITY GATE & MULTI-FILTER VERIFICATION -->
  <g transform="translate(80, 775)">
    <rect width="800" height="150" rx="12" fill="#141B2D" stroke="#F59E0B" stroke-width="1.5" />
    <text x="400" y="26" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 5 &#8226; QUALITY GATE &amp; VERIFICATION</text>
    
    <!-- Check 1: Verbatim Evidence -->
    <g transform="translate(30, 42)">
      <rect width="220" height="85" rx="8" fill="#101726" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">Verbatim Traceability</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Exact Citation Span Check</text>
      <text x="110" y="66" text-anchor="middle" fill="#F43F5E" font-size="10" font-weight="600">Non-negotiable rule</text>
    </g>

    <!-- Check 2: Numeric Validator -->
    <g transform="translate(290, 42)">
      <rect width="220" height="85" rx="8" fill="#101726" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">Numeric Validator</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Symbolic Cross-Check</text>
      <text x="110" y="66" text-anchor="middle" fill="#00F0FF" font-size="10" font-weight="600">No Hallucinated Stats</text>
    </g>

    <!-- Check 3: Semantic Deduplicator -->
    <g transform="translate(550, 42)">
      <rect width="220" height="85" rx="8" fill="#101726" stroke="#334155" stroke-width="1" />
      <text x="110" y="28" text-anchor="middle" fill="#F1F5F9" font-size="12" font-weight="700">Deduplicator</text>
      <text x="110" y="48" text-anchor="middle" fill="#94A3B8" font-size="11">Cosine Similarity (0.88)</text>
      <text x="110" y="66" text-anchor="middle" fill="#10B981" font-size="10" font-weight="600">MiniLM Embeddings</text>
    </g>
  </g>

  <!-- Connect Stage 6 to Output Branches -->
  <!-- Left branch: Rejected -->
  <path d="M 200 925 L 200 965" stroke="#F43F5E" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Center branch: Review -->
  <path d="M 480 925 L 480 965" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow)" />
  <!-- Right branch: Approved -->
  <path d="M 760 925 L 760 965" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Decision Nodes -->
  <g transform="translate(90, 965)">
    <rect width="220" height="48" rx="8" fill="#1F1522" stroke="#F43F5E" stroke-width="1.2" />
    <text x="110" y="28" text-anchor="middle" fill="#F43F5E" font-size="12" font-weight="700">Rejected &#8226; Auto-Purged</text>
  </g>

  <g transform="translate(370, 965)">
    <rect width="220" height="48" rx="8" fill="#1F1C15" stroke="#F59E0B" stroke-width="1.2" />
    <text x="110" y="28" text-anchor="middle" fill="#F59E0B" font-size="12" font-weight="700">Needs Review &#8226; Audit Queue</text>
  </g>

  <g transform="translate(650, 965)">
    <rect width="220" height="48" rx="8" fill="#10231D" stroke="#10B981" stroke-width="1.5" />
    <text x="110" y="28" text-anchor="middle" fill="#10B981" font-size="12" font-weight="800">Approved for Fine-Tuning</text>
  </g>

  <!-- Connect Approved to Export -->
  <path d="M 760 1013 L 760 1045 L 480 1045 L 480 1070" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

  <!-- STAGE 6: EXPORT FORMATS -->
  <g transform="translate(180, 1070)">
    <rect width="600" height="70" rx="12" fill="#141B2D" stroke="#00F0FF" stroke-width="1.5" />
    <text x="300" y="26" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700" letter-spacing="0.08em">STAGE 6 &#8226; DOCUMENT-LEVEL DATASET EXPORT</text>
    <text x="300" y="48" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">Alpaca JSONL &#8226; ShareGPT JSONL &#8226; Audit Provenance JSONL</text>
  </g>

</svg>
