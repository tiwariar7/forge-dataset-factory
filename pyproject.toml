[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-dataset-factory"
version = "0.1.0"
description = "100% Local, Hybrid Document-to-SFT Dataset Factory with Multi-Engine Support (Ollama, llama.cpp, vLLM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Arman Tiwari" }
]
keywords = [
    "sft",
    "fine-tuning",
    "dataset-factory",
    "synthetic-data",
    "llama-cpp",
    "ollama",
    "vllm",
    "chunking",
    "provenance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "sentence-transformers>=2.2.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
    "pdfminer.six>=20221105",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "docling>=1.0.0; python_version < '3.13'",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]
llamacpp = [
    "llama-cpp-python>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
all = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
forge-dataset = "ForgeDataset.cli:main"

[project.urls]
Homepage = "https://github.com/tiwariar7/forge-dataset-factory"
Repository = "https://github.com/tiwariar7/forge-dataset-factory.git"
Issues = "https://github.com/tiwariar7/forge-dataset-factory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ForgeDataset*"]
exclude = ["tests*", "docs*", "assets*"]
